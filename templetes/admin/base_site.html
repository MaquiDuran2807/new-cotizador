{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | CodenSolar{% endblock %}

{% block branding %}
<div id="branding">
    <a href="{% url 'admin:index' %}" id="site-name">
        <img src="{% static 'products/img/LOGO PNG 1.png' %}" alt="CodenSolar" class="admin-logo" height="100">
        <span class="admin-brand-text">Coden<span class="brand-solar">Solar</span></span>
    </a>
</div>
{% endblock %}

{% block nav-global %}
  <div style="display:inline-block; margin-left: 24px;">
    <a href="{% url 'admin:bulk-import' %}"
       style="color:#fff; text-decoration:none; font-size:13px; padding:6px 14px; background:rgba(255,255,255,.15); border-radius:4px; transition:background .2s;"
       onmouseover="this.style.background='rgba(255,255,255,.25)'"
       onmouseout="this.style.background='rgba(255,255,255,.15)'">
      &#128230; Carga Masiva
    </a>
  </div>
{% endblock %}
