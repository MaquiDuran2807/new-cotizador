{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(#0f172a, #0a5071, #545554);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .allauth-card {
            background: #0e1734;
            padding: 35px;
            border-radius: 10px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            color: #fff;
        }
        .allauth-card h1, .allauth-card h2 {
            font-size: 1.6em;
            margin-bottom: 15px;
            color: #fff;
        }
        .allauth-card p {
            margin-bottom: 15px;
            line-height: 1.5;
            color: #ccc;
        }
        .allauth-card a {
            color: #40C92A;
        }
        .allauth-card form {
            margin-top: 15px;
        }
        .allauth-card button,
        .allauth-card input[type="submit"] {
            background: linear-gradient(97deg, #0F172A, #545554, #40C92A);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            margin-top: 10px;
        }
        .allauth-card button:hover,
        .allauth-card input[type="submit"]:hover {
            opacity: 0.9;
        }
        .allauth-card ul {
            list-style: none;
            margin: 10px 0;
        }
        .allauth-card li {
            margin: 5px 0;
        }
        .messages {
            margin-bottom: 15px;
            color: #40C92A;
        }
    </style>
</head>
<body>
    <div class="allauth-card">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
