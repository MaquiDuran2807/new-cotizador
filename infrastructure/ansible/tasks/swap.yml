---
- name: Check if swap already exists
  command: swapon --show
  register: swap_check
  changed_when: false

- name: Create swap file
  command: |
    dd if=/dev/zero of=/swapfile bs=1M count={{ swap_file_size_mb }}
  when: swap_check.stdout == ""

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: "0600"
  when: swap_check.stdout == ""

- name: Format swap
  command: mkswap /swapfile
  when: swap_check.stdout == ""

- name: Enable swap
  command: swapon /swapfile
  when: swap_check.stdout == ""

- name: Add to fstab
  lineinfile:
    path: /etc/fstab
    regexp: "^/swapfile"
    line: "/swapfile none swap sw 0 0"
  when: swap_check.stdout == ""

- name: Set swappiness
  sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: yes
