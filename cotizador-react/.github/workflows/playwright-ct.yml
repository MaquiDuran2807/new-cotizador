name: Playwright Component Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'cotizador-react/**'
      - '.github/workflows/playwright-ct.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cotizador-react/**'

defaults:
  run:
    working-directory: ./cotizador-react

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './cotizador-react/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright CT tests
        run: npx playwright test --config playwright-ct.config.ts
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: cotizador-react/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: cotizador-react/test-results/
          retention-days: 14
